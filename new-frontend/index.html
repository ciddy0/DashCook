<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>souschat</title>
    <meta
      name="description"
      content="Paste any recipe URL and get just the ingredients and steps. No ads, no life stories."
    />

    <!-- Open Graph (Facebook, iMessage, Slack, Discord, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="souschat. recipes without the fluff" />
    <meta
      property="og:description"
      content="Paste any recipe URL and get just the ingredients and steps."
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="souschat. recipes without the fluff" />
    <meta
      name="twitter:description"
      content="Paste any recipe URL and get just the ingredients and steps."
    />

    <!-- Default (cream) theme background. Kept in sync with --bg. -->
    <meta name="theme-color" content="#FAF7F2" />
    <script>
      // Apply the stored theme to <html> before first paint. The theme tokens
      // are scoped to html.theme-*, and the canvas that paints the mobile
      // status-bar safe area comes from the root element, so doing this in
      // React instead would flash the cream background on a dark theme.
      (function () {
        try {
          var bg = {
            cream: "#FAF7F2",
            dark: "#141312",
            calico: "#FFF7F2",
            espresso: "#F4EFE9",
            noir: "#101013",
          };
          var t = localStorage.getItem("souschat.theme");
          if (!t || !bg[t]) return;
          if (t !== "cream") document.documentElement.classList.add("theme-" + t);
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", bg[t]);
        } catch (e) {
          /* private mode / storage disabled: fall back to the cream default */
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
